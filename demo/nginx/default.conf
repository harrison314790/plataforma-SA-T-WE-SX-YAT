# Único punto de entrada de la demo:
#   /                 -> Angular compilado (estático)
#   /api, /sanctum    -> php-fpm (Laravel), contenedor `app`
#
# El puerto 80 se publica SOLO en 127.0.0.1 del portátil (docker-compose.yml):
# lo único que llega desde afuera es lo que entra por cloudflared.

# IP real del visitante. Cloudflare la manda en CF-Connecting-IP; sin
# esto, todos los estudiantes del colegio llegarían con la IP del túnel y
# compartirían UN solo cupo del límite de intentos del login. Se confía
# en cualquier origen porque nginx solo es alcanzable desde el portátil.
set_real_ip_from 0.0.0.0/0;
real_ip_header CF-Connecting-IP;

# Esquema original: cloudflared manda X-Forwarded-Proto https; si se
# entra directo a http://localhost no viene y queda http.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Un lote de notas o una matrícula en lote no pasa de unos KB.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cabeceras básicas. Sin Content-Security-Policy a propósito: el build
    # de Angular inserta un onload en línea para cargar el CSS y una CSP
    # estricta lo bloquearía; ver demo/README.md.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --- API Laravel -------------------------------------------------
    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_original;
        # Nunca se reenvía el X-Forwarded-For del cliente: Laravel no lo
        # usa (ver bootstrap/app.php) y así no hay nada que falsificar.
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Salud de Laravel (sin tocar la base).
    location = /up {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        access_log off;
    }

    # --- Angular -----------------------------------------------------
    # Archivos con hash en el nombre: se pueden cachear para siempre.
    location ~* \.(?:js|css|woff2|png|svg|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Cualquier otra ruta (/login, /asignaciones, /notas...) es una ruta
    # de Angular: se devuelve index.html para que F5 no dé 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
