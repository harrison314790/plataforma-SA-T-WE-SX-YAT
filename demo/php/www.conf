; Pool de PHP-FPM de la demo. Se carga DESPUÉS de www.conf/zz-docker.conf
; de la imagen oficial, así que estos valores ganan.
[www]
; Sin esto, PHP-FPM borra las variables de entorno y Laravel no ve las de
; demo/backend.env ni DB_PASSWORD.
clear_env = no

; Cada worker atiende UNA petición a la vez. El login es lo más pesado
; (bcrypt cost 12 ~ 0,2-0,3 s de CPU), así que más workers que núcleos no
; acelera el login: solo reparte la espera. Ver demo/README.md (prueba de
; carga) antes de cambiarlo.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
