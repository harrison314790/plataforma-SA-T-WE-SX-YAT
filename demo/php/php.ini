; PHP para la demo: sin errores en pantalla, opcache encendido.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; El código está copiado en la imagen y no cambia mientras corre.
opcache.validate_timestamps = 0
